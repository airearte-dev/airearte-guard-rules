name: Validate and publish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de las herramientas
        run: for f in tools/*.php; do php -l "$f"; done

      - name: Validar los paquetes
        run: php tools/validate.php

  publish:
    # Una etiqueta v<serial> publica los paquetes. Sólo si son válidos, ninguno supera la etiqueta, ninguno baja de la
    # versión publicada y al menos uno trae algo nuevo: los sitios rechazarían una versión menor, pero así ni siquiera
    # llega a publicarse.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Lo que ya está publicado
        run: gh release download --pattern '*.json' --dir previous || echo "No hay ninguna versión publicada todavía."

      - name: La etiqueta y las versiones son correctas
        run: php tools/publish-check.php "$TAG" previous

      # Cada release lleva los dos paquetes: los sitios descargan siempre de la última, cada uno con su propia versión.
      - name: Publicar la release
        run: gh release create "$TAG" packages/waf-rules.json packages/malware-signatures.json --title "$TAG" --notes "Reglas del WAF y firmas de malware, versión ${TAG#v}." --latest
